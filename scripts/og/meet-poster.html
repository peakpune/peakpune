<!-- Custom OG poster for /meet. Regenerate: google-chrome --headless=new --disable-gpu --no-sandbox --hide-scrollbars --screenshot=../../public/og/meet.png --window-size=1200,630 meet-poster.html (run from scripts/og). generate.mjs intentionally has no meet entry. -->
<!doctype html><meta charset="utf-8">
<style>
@font-face{font-family:Fraunces;src:url(../../public/fonts/fraunces.woff2)}
@font-face{font-family:Inter;src:url(../../public/fonts/inter.woff2)}
*{margin:0;box-sizing:border-box}
body{width:1200px;height:630px;background:#F4EBDA;font-family:Inter,sans-serif;position:relative;overflow:hidden}
.frame{position:absolute;inset:24px;border:2px solid rgba(28,20,16,.55);border-radius:26px}
.brand{position:absolute;top:64px;left:70px;font-family:Fraunces,serif;font-weight:800;font-size:36px;color:#1C1410}
.brand em{color:#B8381F}
.kick{position:absolute;top:128px;left:70px;background:#1C1410;color:#E8A317;font-weight:800;font-size:16px;letter-spacing:.16em;padding:9px 20px;border-radius:999px}
h1{position:absolute;top:178px;left:66px;font-family:Fraunces,serif;font-weight:800;font-size:96px;line-height:1;color:#1C1410;letter-spacing:-.02em}
h1 em{color:#B8381F}
.sub{position:absolute;bottom:96px;left:70px;font-size:25px;font-weight:500;color:#3B2F24}
.card{position:absolute;top:92px;right:90px;width:470px;background:#E8A317;border:6px solid #1C1410;border-radius:28px;box-shadow:14px 14px 0 #1C1410;transform:rotate(3deg);padding:30px 34px 34px}
.card small{display:block;font-weight:800;font-size:15px;letter-spacing:.22em;color:#1C1410;margin-bottom:14px}
.card b{display:block;font-family:Fraunces,serif;font-weight:800;font-size:50px;line-height:1.06;color:#1C1410}
.card span{display:block;font-weight:800;font-size:25px;color:#1C1410;margin-top:14px}
.spots{position:absolute;top:468px;right:120px;background:#C9D6B5;border:5px solid #1C1410;border-radius:22px;box-shadow:8px 8px 0 #1C1410;transform:rotate(-1deg);padding:12px 26px;font-family:Fraunces,serif;font-weight:800;font-size:31px;color:#1C1410}
.foot{position:absolute;left:0;right:0;bottom:0;height:64px;background:#B8381F;color:#fff;font-weight:700;font-size:24px;display:flex;align-items:center;padding-left:70px}
</style>
<div class="frame"></div>
<div class="brand">Peak <em>Pune</em></div>
<div class="kick">MEET Nº 1</div>
<h1>First<br><em>Meet.</em></h1>
<div class="sub">Board games · Shivajinagar walk · Cafe-hop</div>
<div class="card"><small>IT HAPPENS</small><b>Saturday,<br>28 November</b><span>3:30 PM IST</span></div>
<div class="spots">10 spots · Rs 150 cover</div>
<div class="foot">peakpune.com/meet</div>
