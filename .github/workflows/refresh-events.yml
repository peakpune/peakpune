name: Refresh events
# Daily. Rebuilds the site so events that have ended drop out of the committed event pages and
# calendar files. Opens a pull request; never pushes to main.
on:
  schedule:
    - cron: '23 20 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: refresh-events
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Open a pull request if the event files changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add -A public/events public/calendar
          git diff --cached --quiet && { echo "No change"; exit 0; }
          BR="data/events-refresh-$(date -u +%Y%m%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BR"
          git commit -m "Refresh event pages and calendar files"
          git push origin "$BR"
          gh pr create --base main --head "$BR" --title "Refresh event pages and calendar files" --body "Regenerated by npm run build. Drops events that have ended. Run the Tests check, then merge."
