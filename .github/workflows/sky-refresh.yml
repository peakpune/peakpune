name: Sky page refresh
# Quarterly. Opens a pull request; never pushes to main. The PR still needs the usual review and merge.
on:
  schedule:
    - cron: '17 4 3 1,4,7,10 *'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/sky/requirements.txt
      - run: pip install -r scripts/sky/requirements.txt
      - run: npm ci --ignore-scripts
      - run: npm run build:types
      - run: scripts/sky/generate.sh
      - run: npm run build
      - name: Open a pull request if anything changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git diff --quiet -- data/sky site/pages/sky.html public/sky && { echo "No change"; exit 0; }
          BR="data/sky-refresh-$(date -u +%Y%m%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BR"
          git add data/sky site/pages/sky.html public/sky
          git commit -m "Refresh Pune sky calendar data"
          git push origin "$BR"
          gh pr create --base main --head "$BR" --title "Refresh Pune sky calendar data" --body "Regenerated by scripts/sky/generate.sh. Moon, eclipse, planet, meteor-night and star data only. Meteor nights for years not listed in data/sky/meteor-nights.json checked_years are labelled unchecked on the page. Run the Tests check, then review the page at /sky/."
