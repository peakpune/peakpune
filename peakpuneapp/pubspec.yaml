name: peakpune
description: "Peak Pune: places, outdoors, plans, history, shopping and an offline metro guide."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.13.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  # Opens source links, maps and join pages in other apps. No network access from the app itself.
  url_launcher: ^6.3.3
  # System share sheet for entries.
  share_plus: ^13.3.1
  # Hands a dated event to the phone's calendar app (an Android intent; no calendar permission).
  add_2_calendar: ^3.1.1
  # Remembers the welcome screen and the History language choice on the device.
  shared_preferences: ^2.5.6
  # Material shared-axis and fade-through transitions.
  animations: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/fonts/fraunces-OFL.txt
    - assets/fonts/inter-OFL.txt
  # Variable fonts from public/fonts/ in this repository. Weights are picked with
  # FontVariation('wght', ...) in lib/theme/theme.dart.
  fonts:
    - family: Fraunces
      fonts:
        - asset: assets/fonts/fraunces.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/inter.ttf
