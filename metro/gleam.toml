name = "peakpune_metro"
version = "1.0.0"
description = "Offline Pune Metro journey planner for peakpune.com/PuneMetroguide/"
licences = ["MIT"]
# Compiles to JavaScript only: no backend, no Erlang target, no per-request compute.
target = "javascript"

[dependencies]
gleam_stdlib = ">= 1.0.0 and < 2.0.0"
lustre = ">= 5.7.1 and < 6.0.0"

[dev-dependencies]
gleeunit = ">= 1.9.0 and < 2.0.0"
# Dev tooling only. The committed bundle is what ships; see metro/README.md for the build.
lustre_dev_tools = ">= 2.4.0 and < 3.0.0"
